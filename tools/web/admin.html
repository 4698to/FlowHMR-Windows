<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FlowHMR 管理后台</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="admin-shell">
  <header class="admin-top">
    <div class="admin-brand">
      <span class="brand-mark"></span>
      <strong>FlowHMR</strong>
      <span class="muted">管理后台</span>
    </div>
    <div class="admin-actions">
      <span id="connState" class="badge">连接中…</span>
      <span id="pauseBadge" class="badge warn hidden">已暂停派发</span>
      <button type="button" id="btnRefresh" class="ghost">刷新</button>
      <button type="button" id="btnPause" class="ghost">暂停派发</button>
      <button type="button" id="btnClear" class="ghost danger">清空队列</button>
      <button type="button" id="btnLogout" class="ghost">退出</button>
    </div>
  </header>

  <main class="admin-main">
    <section id="loginView" class="login-card hidden">
      <h1>管理员登录</h1>
      <p class="muted">使用启动参数 <code>--admin-key</code>（或环境变量 <code>FLOWHMR_ADMIN_KEY</code>）配置的密钥。</p>
      <form id="loginForm" autocomplete="off">
        <input id="loginKey" type="password" placeholder="管理员密钥" autocomplete="current-password" required>
        <button type="submit" class="primary">进入控制台</button>
      </form>
      <p id="loginError" class="error hidden"></p>
    </section>

    <section id="appView" class="hidden">
      <div class="kpis" id="kpis"></div>

      <nav class="tabs" id="tabs" role="tablist">
        <button type="button" data-tab="jobs" class="active" role="tab">任务池</button>
        <button type="button" data-tab="queue" role="tab">队列</button>
        <button type="button" data-tab="users" role="tab">用户</button>
        <button type="button" data-tab="storage" role="tab">存储</button>
        <button type="button" data-tab="audit" role="tab">审计</button>
      </nav>

      <section class="panel" id="tab-jobs" data-panel="jobs">
        <div class="panel-head">
          <div class="filters">
            <input id="jobSearch" type="search" placeholder="搜索文件名 / 昵称 / 任务 ID">
            <select id="jobStatus">
              <option value="">全部状态</option>
              <option value="active">进行中</option>
              <option value="done">已完成</option>
              <option value="failed">失败</option>
              <option value="cancelled">已取消</option>
            </select>
          </div>
          <span id="jobCount" class="muted"></span>
        </div>
        <div class="table-scroll">
          <table class="grid" id="jobTable">
            <thead>
              <tr>
                <th>状态</th><th>文件</th><th>属主</th><th>来源 IP</th><th class="num">帧数</th>
                <th>评分</th><th class="num">进度</th><th class="num">排队</th><th>创建</th><th class="actions-col">操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel hidden" id="tab-queue" data-panel="queue">
        <div class="queue-running" id="queueRunning"></div>
        <div class="panel-head">
          <span class="muted" id="queueLimits"></span>
          <span class="muted">排队中的任务按“优先级 → 用户轮转 → 提交顺序”派发</span>
        </div>
        <div class="table-scroll">
          <table class="grid" id="queueTable">
            <thead>
              <tr><th class="num">位置</th><th>任务</th><th>属主</th><th class="num">优先级</th><th>状态</th><th class="actions-col">操作</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel hidden" id="tab-users" data-panel="users">
        <div class="panel-head">
          <span class="muted">禁用用户后，其提交与重跑将返回 403；管理员不受影响。</span>
          <span id="userCount" class="muted"></span>
        </div>
        <div class="table-scroll">
          <table class="grid" id="userTable">
            <thead>
              <tr><th>昵称</th><th>UID</th><th>来源 IP</th><th>最近访问</th><th class="num">任务</th>
                <th class="num">排队</th><th class="num">磁盘</th><th>状态</th><th class="actions-col">操作</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel hidden" id="tab-storage" data-panel="storage">
        <div id="storageSummary" class="storage-summary"></div>
        <div class="storage-columns">
          <div>
            <h3>按用户</h3>
            <table class="grid compact" id="storageOwnerTable">
              <thead><tr><th>用户</th><th class="num">任务</th><th class="num">占用</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div>
            <h3>按状态</h3>
            <table class="grid compact" id="storageStatusTable">
              <thead><tr><th>状态</th><th class="num">任务</th><th class="num">占用</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div>
            <h3>未关联目录</h3>
            <table class="grid compact" id="storageOrphanTable">
              <thead><tr><th>目录</th><th class="num">占用</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="cleanup-bar">
          <label>保留天数 <input id="cleanupDays" type="number" min="1" max="3650" value="30"></label>
          <button type="button" id="btnCleanupOld" class="ghost">清理到期已完成任务</button>
          <button type="button" id="btnCleanupLegacy" class="ghost">清理历史任务</button>
          <button type="button" id="btnCleanupOrphans" class="ghost danger">清理孤立目录</button>
        </div>
      </section>

      <section class="panel hidden" id="tab-audit" data-panel="audit">
        <div class="panel-head">
          <div class="filters">
            <input id="auditAction" type="search" placeholder="动作前缀，如 queue./job.">
            <select id="auditResult">
              <option value="">全部结果</option>
              <option value="ok">成功</option>
              <option value="denied">拒绝</option>
              <option value="failed">失败</option>
              <option value="deferred">延迟</option>
              <option value="limited">限流</option>
              <option value="not_found">不存在</option>
            </select>
            <button type="button" id="btnAuditFilter" class="ghost">筛选</button>
          </div>
          <span id="auditCount" class="muted"></span>
        </div>
        <div class="table-scroll">
          <table class="grid" id="auditTable">
            <thead><tr><th>时间</th><th>动作</th><th>目标</th><th>结果</th><th>IP</th><th>详情</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="load-more"><button type="button" id="btnAuditMore" class="ghost">加载更多</button></div>
      </section>
    </section>
  </main>
</div>

<aside id="drawer" class="drawer hidden" aria-hidden="true">
  <header>
    <h2 id="drawerTitle">任务详情</h2>
    <button type="button" id="drawerClose" class="icon-btn" aria-label="关闭">×</button>
  </header>
  <div id="drawerBody" class="drawer-body"></div>
</aside>
<div id="drawerScrim" class="scrim hidden"></div>

<div id="toast" class="toast hidden" role="status"></div>

<dialog id="confirmDialog" class="confirm">
  <form method="dialog">
    <h3 id="confirmTitle">确认操作</h3>
    <p id="confirmMessage"></p>
    <label id="confirmWordWrap" class="hidden">请输入 <code id="confirmWordHint"></code> 以确认
      <input id="confirmWordInput" type="text" autocomplete="off"></label>
    <div class="confirm-actions">
      <button type="button" id="confirmCancel" class="ghost">取消</button>
      <button type="button" id="confirmOk" class="primary danger">确认</button>
    </div>
  </form>
</dialog>

<dialog id="downloadDialog" class="confirm download-dialog">
  <form method="dialog">
    <h3>下载任务产物</h3>
    <p id="downloadTarget" class="muted"></p>
    <div id="downloadOptions" class="download-options"></div>
    <div class="confirm-actions">
      <button type="button" id="downloadClose" class="ghost">关闭</button>
    </div>
  </form>
</dialog>

<script type="module" src="/static/js/admin.js"></script>
</body>
</html>
